services:
  - type: web
    name: m1-2-data-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: STORAGE_BACKEND
        value: firestore
      - key: AI_BACKEND
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: 500
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
